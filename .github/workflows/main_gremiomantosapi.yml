name: Build and deploy Azure Functions API (OIDC) - gremiomantosapi

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/main_gremiomantosapi.yml"
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: gremiomantosapi
  NODE_VERSION: "20.x"
  API_DIR: "api"
  OUTPUT_DIR: "output"
  ZIP_NAME: "deploy.zip"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.API_DIR }}/package-lock.json

      - name: Install dependencies and build (API)
        working-directory: ${{ env.API_DIR }}
        run: |
          npm ci
          npm run build
          ls -la dist/

      - name: Prepare deployment package
        run: |
          rm -rf "${{ env.OUTPUT_DIR }}"
          mkdir -p "${{ env.OUTPUT_DIR }}"

          # Copy runtime files expected by Azure Functions
          cp "${{ env.API_DIR }}/host.json" "${{ env.OUTPUT_DIR }}/"
          cp "${{ env.API_DIR }}/package.json" "${{ env.OUTPUT_DIR }}/"
          cp "${{ env.API_DIR }}/package-lock.json" "${{ env.OUTPUT_DIR }}/"
          
          # Copy compiled code (KEEP dist/ structure - Azure Functions v4 needs it!)
          cp -R "${{ env.API_DIR }}/dist" "${{ env.OUTPUT_DIR }}/dist"

          # Install production dependencies only
          pushd "${{ env.OUTPUT_DIR }}"
          npm ci --omit=dev
          popd

          # Zip package
          pushd "${{ env.OUTPUT_DIR }}"
          zip -r "../${{ env.ZIP_NAME }}" . -q
          popd

          ls -lh "${{ env.ZIP_NAME }}"
          
          # Debug: Show structure
          echo "=== Deployment package structure ==="
          unzip -l "${{ env.ZIP_NAME }}" | grep -E "(host.json|package.json|dist/)" | head -n 30

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functionapp-package
          path: ${{ env.ZIP_NAME }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: functionapp-package

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.ZIP_NAME }}

      - name: Wait for cold start
        run: sleep 30

      - name: Health check
        run: |
          BASE_URL="https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net"
          echo "Testing health endpoint..."
          curl -s -i "$BASE_URL/api/health" | head -n 20 || echo "Health endpoint not found (expected)"
          
          echo "Testing itens endpoint..."
          curl -s -i "$BASE_URL/api/itens" | head -n 20
           - name: Warm up admin functions  
          # Tenta acessar cada função admin (vai retornar 401 mas força o carregamento)
          curl -s -o /dev/null -w "%{http_code} " "$BASE_URL/api/admin/usuarios" || true
          curl -s -o /dev/null -w "%{http_code} " "$BASE_URL/api/admin/tenants" || true
          curl -s -o /dev/null -w "%{http_code} " "$BASE_URL/api/admin/planos" || true
          curl -s -o /dev/null -w "%{http_code} " "$BASE_URL/api/admin/metricas" || true
          
          echo ""
          echo "Warm-up complete. Functions should be ready."

