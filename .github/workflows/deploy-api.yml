# Workflow: build + deploy Azure Functions (usando Service Principal / RBAC)
name: Deploy API to Azure Functions (RBAC)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AZURE_CREDENTIALS secret
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "❌ AZURE_CREDENTIALS secret not found. Create it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✅ AZURE_CREDENTIALS present (length: ${#AZURE_CREDENTIALS})"

      - name: Login to Azure (Service Principal / RBAC)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies & Build
        working-directory: api
        run: |
          echo "📦 Installing dependencies"
          npm ci

          echo "🔨 Building TypeScript"
          npm run build

          echo "✅ Build finished. dist/ contents:"
          ls -la dist || true

      - name: Prune devDependencies to make package lighter
        working-directory: api
        run: |
          echo "Pruning devDependencies (production only)..."
          npm prune --production || true
          echo "node_modules size:"
          du -sh node_modules || true

      - name: Prepare package check
        working-directory: api
        run: |
          echo "Verifying host.json exists in api:"
          if [ -f host.json ]; then
            echo "✅ host.json found"
          else
            echo "❌ host.json not found at api/host.json — deployment may fail"
            ls -la
            exit 1
          fi

          echo ""
          echo "Listing top-level files in api/:"
          ls -la

      - name: Deploy to Azure Functions (RBAC)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: './api'
        # No AZURE_FUNCTIONAPP_PUBLISH_PROFILE needed when using RBAC (azure/login)

      - name: Wait for app to warm up
        run: |
          echo "Waiting a few seconds for the Function App to warm up..."
          sleep 8

      - name: Health check (optional)
        run: |
          APP_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health"
          echo "Checking $APP_URL"
          n=0
          until [ $n -ge 3 ]
          do
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$APP_URL" || echo "000")
            echo "Attempt $((n+1)): HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health endpoint OK:"
              cat /tmp/health.txt | head -n 40
              break
            fi
            n=$((n+1))
            sleep $((n * 3))
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Health check failed (last HTTP code: $HTTP_CODE). Check Function App logs in Azure Portal."
            exit 0
          fi
