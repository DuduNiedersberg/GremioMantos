name: Deploy Azure Functions API (via CLI)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 'Checkout código'
      uses: actions/checkout@v4

    - name: 'Setup Node.js ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Instalar Azure Functions Core Tools'
      run: |
        echo "📦 Instalando Azure Functions Core Tools..."
        wget -q https://packages.microsoft.com/config/ubuntu/20.04/packages-microsoft-prod.deb
        sudo dpkg -i packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y azure-functions-core-tools-4

    - name: 'Build da aplicação'
      working-directory: api
      run: |
        echo "📦 Instalando dependências..."
        npm ci
        
        echo "🔨 Compilando TypeScript..."
        npm run build
        
        echo "🧹 Limpando dev dependencies..."
        npm prune --production
        
        echo "✅ Build concluído!"
        ls -la

    - name: 'Login no Azure via Publish Profile'
      run: |
        echo "🔐 Configurando credenciais..."
        
        # Extrair informações do publish profile
        echo "${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}" > /tmp/profile.xml
        
        USERNAME=$(grep -oP 'userName="[^"]*"' /tmp/profile.xml | head -1 | cut -d'"' -f2)
        PASSWORD=$(grep -oP 'userPWD="[^"]*"' /tmp/profile.xml | head -1 | cut -d'"' -f2)
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        rm /tmp/profile.xml
        
        # Remover WEBSITE_RUN_FROM_PACKAGE se existir
        echo "🔧 Verificando WEBSITE_RUN_FROM_PACKAGE..."
        
        SETTINGS=$(curl -s -u "$USERNAME:$PASSWORD" "$KUDU_URL/api/settings")
        
        if echo "$SETTINGS" | grep -q "WEBSITE_RUN_FROM_PACKAGE"; then
          echo "⚠️ Encontrado! Removendo..."
          curl -X DELETE -u "$USERNAME:$PASSWORD" \
            "$KUDU_URL/api/settings/WEBSITE_RUN_FROM_PACKAGE"
          echo "✅ Removido"
          sleep 10
        else
          echo "✅ Não existe"
        fi

    - name: 'Deploy via Kudu ZIP Deploy'
      working-directory: api
      run: |
        echo "📦 Criando pacote ZIP..."
        zip -r deploy.zip . -x "*.git*" "node_modules/@types/*" "*.ts" "tsconfig.json"
        
        echo "Tamanho do ZIP:"
        ls -lh deploy.zip
        
        echo ""
        echo "🚀 Fazendo deploy..."
        
        # Extrair credenciais
        echo "${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}" > /tmp/profile.xml
        USERNAME=$(grep -oP 'userName="[^"]*"' /tmp/profile.xml | head -1 | cut -d'"' -f2)
        PASSWORD=$(grep -oP 'userPWD="[^"]*"' /tmp/profile.xml | head -1 | cut -d'"' -f2)
        rm /tmp/profile.xml
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        HTTP_CODE=$(curl -X POST \
          -u "$USERNAME:$PASSWORD" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/zip" \
          -w "%{http_code}" \
          -o response.txt \
          --max-time 600 \
          "$KUDU_URL/api/zipdeploy")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ -f response.txt ]; then
          echo "Response:"
          cat response.txt
        fi
        
        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
          echo "✅ Deploy bem-sucedido!"
        else
          echo "❌ Deploy falhou com código $HTTP_CODE"
          exit 1
        fi

    - name: 'Aguardar inicialização'
      run: |
        echo "⏳ Aguardando cold start (90s)..."
        sleep 90

    - name: 'Health Check'
      run: |
        echo "🔍 Testando endpoints..."
        
        BASE_URL="https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net"
        
        for i in {1..10}; do
          echo "Tentativa $i/10..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" "$BASE_URL/api/health" || echo "error")
          
          if [ "$RESPONSE" != "error" ]; then
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            echo "Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Health check passou!"
              echo "Resposta: $BODY"
              echo ""
              echo "🎉 Deploy concluído com sucesso!"
              exit 0
            fi
          fi
          
          if [ $i -lt 10 ]; then
            echo "Aguardando 15s..."
            sleep 15
          fi
        done
        
        echo "⚠️ Health check não passou, mas deploy foi concluído"
        echo "Verifique manualmente: $BASE_URL/api/health"
