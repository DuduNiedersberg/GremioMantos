name: Deploy Azure Functions API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy: 
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 'Checkout código'
      uses: actions/checkout@v4

    - name: 'Setup Node.js ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Build da aplicação'
      working-directory: api
      run: |
        echo "📦 Instalando dependências..."
        npm ci
        
        echo "🔨 Compilando TypeScript..."
        npm run build
        
        echo "✅ Build concluído!"
        ls -la dist/

    - name: 'Preparar pacote ZIP'
      working-directory: api
      run: |
        echo "📁 Criando estrutura de deploy..."
        mkdir -p deploy
        
        # Copiar host.json e package files para raiz
        echo "Copiando arquivos de configuração..."
        cp host.json deploy/
        cp package.json deploy/
        cp package-lock.json deploy/
        
        # Copiar arquivos compilados mantendo estrutura
        echo "Copiando dist/ para deploy/..."
        if [ -d "dist/functions" ]; then
          # Se tiver estrutura de pastas no dist
          cp -r dist/* deploy/
        else
          # Se dist contém diretamente as funções
          cp -r dist/* deploy/
        fi
        
        # Verificar estrutura antes de instalar deps
        echo "📋 Estrutura atual:"
        find deploy -type f -name "*.json" | head -20
        
        # Instalar dependências de produção
        echo "Instalando dependências de produção..."
        cd deploy
        npm ci --omit=dev
        
        # Criar ZIP
        echo "Criando ZIP..."
        zip -r ../deploy.zip .
        cd ..
        
        echo "✅ ZIP criado:"
        ls -lh deploy.zip
        echo "📋 Conteúdo do ZIP (primeiros 30 arquivos):"
        unzip -l deploy.zip | head -30

    - name: 'Deploy via Kudu ZIP API'
      working-directory: api
      run: |
        echo "🚀 Fazendo deploy via Kudu..."
        
        HTTP_CODE=$(curl -X POST \
          -u "${{ secrets.AZURE_DEPLOY_USERNAME }}:${{ secrets.AZURE_DEPLOY_PASSWORD }}" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/zip" \
          -w "%{http_code}" \
          -o response.txt \
          --max-time 600 \
          "https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net/api/zipdeploy?isAsync=true")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ -f response.txt ]; then
          echo "Response:"
          cat response.txt
        fi
        
        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
          echo "✅ Deploy iniciado com sucesso!"
        else
          echo "❌ Deploy falhou com código $HTTP_CODE"
          exit 1
        fi

    - name: 'Verificar status do deployment'
      run: |
        echo "⏳ Verificando status do deployment..."
        
        for i in {1..12}; do
          echo "Verificação $i/12..."
          
          STATUS=$(curl -s \
            -u "${{ secrets.AZURE_DEPLOY_USERNAME }}:${{ secrets.AZURE_DEPLOY_PASSWORD }}" \
            "https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net/api/deployments/latest" \
            | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
          
          echo "Status: $STATUS"
          
          if [ "$STATUS" = "4" ] || [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment completo!"
            break
          elif [ "$STATUS" = "3" ] || [ "$STATUS" = "Failed" ]; then
            echo "❌ Deployment falhou!"
            exit 1
          fi
          
          echo "Aguardando 10s..."
          sleep 10
        done

    - name: 'Aguardar inicialização'
      run: |
        echo "⏳ Aguardando cold start (90s)..."
        sleep 90

    - name: 'Health Check'
      run: |
        echo "🔍 Testando endpoint /api/health..."
        
        for i in {1..10}; do
          echo "Tentativa $i/10..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net/api/health)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Health check passou!"
            echo "Resposta: $BODY"
            exit 0
          fi
          
          if [ $i -lt 10 ]; then
            echo "Aguardando 15s antes de tentar novamente..."
            sleep 15
          fi
        done
        
        echo "⚠️ Health check não retornou 200 após 10 tentativas"
        echo "Verificando logs do Azure..."
        
        # Tentar pegar logs
        curl -s \
          -u "${{ secrets.AZURE_DEPLOY_USERNAME }}:${{ secrets.AZURE_DEPLOY_PASSWORD }}" \
          "https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net/api/logs/docker" \
          | tail -50
        
        exit 1

    - name: 'Testar outros endpoints'
      if: success()
      run: |
        echo "🧪 Testando endpoints principais..."
        
        BASE_URL="https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net"
        
        # Listar funções disponíveis
        echo "📋 Funções disponíveis:"
        curl -s "$BASE_URL/admin/functions" || echo "Endpoint admin não acessível"
