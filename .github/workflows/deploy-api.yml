name: Deploy Azure Functions API

on: 
  push:
    branches: [main]
    paths: 
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 'Checkout código'
      uses:  actions/checkout@v4

    - name: 'Setup Node. js ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v4
      with:
        node-version:  ${{ env.NODE_VERSION }}

    - name: 'Build da aplicação'
      working-directory: api
      run: |
        echo "📦 Instalando dependências..."
        npm ci
        echo "🔨 Compilando TypeScript..."
        npm run build
        echo "✅ Build concluído!"

    - name: 'Preparar pacote ZIP'
      working-directory: api
      run: |
        echo "📁 Criando estrutura de deploy..."
        mkdir -p deploy
        
        # Copiar arquivos compilados
        cp -r dist/. deploy/
        
        # Copiar configurações
        cp host.json deploy/
        cp package.json deploy/
        cp package-lock.json deploy/
        
        # Instalar dependências de produção
        cd deploy
        npm ci --omit=dev
        
        # Criar ZIP
        zip -r ../deploy.zip .
        
        echo "✅ ZIP criado:  $(ls -lh ../deploy. zip)"

    - name: 'Extrair credenciais do publish profile'
      id: publish-profile
      run: |
        # Extrair username e password do XML
        USERNAME=$(echo '${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}' | grep -oP 'userName="\K[^"]+' | head -1)
        PASSWORD=$(echo '${{ secrets. AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}' | grep -oP 'userPWD="\K[^"]+' | head -1)
        
        echo "::add-mask:: $PASSWORD"
        echo "username=$USERNAME" >> $GITHUB_OUTPUT
        echo "password=$PASSWORD" >> $GITHUB_OUTPUT

    - name: 'Deploy via Kudu ZIP API'
      working-directory: api
      run:  |
        echo "🚀 Fazendo deploy via Kudu ZIP API..."
        
        HTTP_CODE=$(curl -X POST \
          -u "${{ steps.publish-profile.outputs.username }}:${{ steps.publish-profile.outputs. password }}" \
          --data-binary @deploy.zip \
          -H "Content-Type:  application/zip" \
          -w "%{http_code}" \
          -o response.txt \
          "https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net/api/zipdeploy")
        
        echo "HTTP Status: $HTTP_CODE"
        cat response.txt
        
        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
          echo "✅ Deploy bem-sucedido!"
        else
          echo "❌ Deploy falhou com código $HTTP_CODE"
          exit 1
        fi

    - name: 'Aguardar inicialização'
      run:  |
        echo "⏳ Aguardando cold start (60s)..."
        sleep 60

    - name: 'Health Check'
      run: |
        echo "🔍 Testando endpoint /api/health..."
        
        for i in {1..5}; do
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites. net/api/health)
          echo "Tentativa $i:  HTTP $HTTP_CODE"
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Health check passou!"
            curl https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net/api/health
            exit 0
          fi
          
          sleep 10
        done
        
        echo "⚠️ Health check não passou após 5 tentativas"
