# Build + Pack + ZipDeploy Azure Functions using Publish Profile credentials (Kudu)
# Does NOT use RBAC / azure/login. Requires secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE
name: Deploy API to Azure Functions (Pack + Kudu ZipDeploy)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Publish Profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "${PUBLISH_PROFILE:-}" ]; then
            echo "❌ AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret not found. Add it at Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ AZURE_FUNCTIONAPP_PUBLISH_PROFILE present (length: ${#PUBLISH_PROFILE})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies & Build
        working-directory: api
        run: |
          set -euo pipefail
          echo "📦 Installing dependencies"
          npm ci

          echo "🔨 Building TypeScript"
          npm run build

          echo "✅ Build finished. dist/ contents:"
          ls -la dist || true

      - name: Prune devDependencies to make package lighter
        working-directory: api
        run: |
          set -euo pipefail
          npm prune --production || true
          du -sh node_modules || true

      - name: Verify package structure
        working-directory: api
        run: |
          set -euo pipefail
          echo "Checking host.json presence..."
          if [ ! -f host.json ]; then
            echo "❌ host.json not found in api/ — deploy likely to fail"
            ls -la
            exit 1
          fi
          echo "✅ host.json exists"
          echo "Listing files:"
          ls -la

      - name: Write Publish Profile to file
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        working-directory: api
        run: |
          set -euo pipefail
          echo "Saving publish profile to ./publishProfile.xml"
          printf '%s' "$PUBLISH_PROFILE" > publishProfile.xml
          echo "publishProfile.xml size: $(wc -c publishProfile.xml | awk '{print $1}') bytes"
          sed -n 's/.*publishUrl="\([^"]*\)".*/PublishUrl: \1/p' publishProfile.xml | head -1 || true

      - name: Install system packages (zip, jq)
        run: |
          set -euo pipefail
          echo "Installing zip/unzip/jq (required for packaging and debug)..."
          sudo apt-get update -y
          sudo apt-get install -y zip unzip jq || true
          echo "zip version: $(zip -v 2>/dev/null | head -n 1 || true)"
          echo "unzip version: $(unzip -v 2>/dev/null | head -n 1 || true)"

      - name: Install Azure Functions Core Tools (v4)
        run: |
          set -euo pipefail
          echo "Installing Azure Functions Core Tools v4..."
          npm i -g azure-functions-core-tools@4 --unsafe-perm true
          echo "func version: $(func --version || true)"

      - name: Create deploy package (try func pack, fallback to manual ZIP)
        working-directory: api
        env:
          FUNCTIONS_WORKER_RUNTIME: node
          WEBSITE_NODE_DEFAULT_VERSION: 20
        run: |
          set -euo pipefail
          echo "ENV CHECK:"
          echo "FUNCTIONS_WORKER_RUNTIME=${FUNCTIONS_WORKER_RUNTIME:-}"
          echo "Node version: $(node --version || true)"
          echo "func version: $(func --version || true)"
          echo ""

          # cleanup previous possible artifacts
          rm -f deploy_package.zip || true
          rm -rf deploy_package || true
          rm -rf tmp_deploy || true
          rm -f func_pack.log || true

          echo "Attempting func pack to create deploy_package or deploy_package.zip..."
          if func pack --output deploy_package 2>&1 | tee func_pack.log; then
            echo "✅ func pack succeeded or created deploy_package directory"
            if [ -d deploy_package ]; then
              echo "Compressing deploy_package directory -> deploy_package.zip"
              (cd deploy_package && zip -r ../deploy_package.zip .) || true
              echo "Created deploy_package.zip from deploy_package directory"
              ls -lh deploy_package.zip || true
              rm -rf deploy_package || true
            elif [ -f deploy_package.zip ]; then
              echo "func pack produced deploy_package.zip directly"
              ls -lh deploy_package.zip || true
            else
              echo "Warning: func pack did not produce expected output; see func_pack.log"
              tail -n 200 func_pack.log || true
            fi
          else
            echo "⚠️ func pack failed — see func_pack.log and will create manual deploy_package.zip fallback"
            tail -n 200 func_pack.log || true
            echo "Creating manual deploy_package.zip (host.json, package.json, package-lock.json, dist, node_modules)..."
            mkdir -p tmp_deploy
            cp -v host.json tmp_deploy/ || true
            cp -v package.json tmp_deploy/ || true
            cp -v package-lock.json tmp_deploy/ || true
            if [ -d dist ]; then
              cp -r dist/* tmp_deploy/ || true
            else
              echo "⚠️ dist/ not found — build may have failed"
            fi
            if [ -d node_modules ]; then
              cp -r node_modules tmp_deploy/ || true
            fi
            (cd tmp_deploy && zip -r ../deploy_package.zip . -x "*.git*" -x "*.ts" -x "tsconfig.json" -x "*.test.js" -x "tests/*" -x ".env*" -x "node_modules/@types/*") || true
            ls -lh deploy_package.zip || true
            rm -rf tmp_deploy || true
          fi

          # Final check: ensure we have a .zip file
          if [ -f deploy_package.zip ]; then
            echo "Final deploy_package.zip size: $(stat -c%s deploy_package.zip || stat -f%z deploy_package.zip)"
            echo "Contents (top 60):"
            unzip -l deploy_package.zip | head -60 || true
          else
            echo "❌ deploy_package.zip not found after packaging steps"
            echo "Workspace listing:"
            ls -la
            exit 1
          fi

      - name: Ensure no Run-From-Package, disable remote build and restart (Kudu)
        working-directory: api
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail

          if [ ! -f publishProfile.xml ]; then
            echo "❌ publishProfile.xml missing. Aborting."
            exit 1
          fi

          # extract publishUrl robustly and strip any scheme/path
          PUBLISH_URL_RAW=$(sed -n 's/.*publishUrl="\([^"]*\)".*/\1/p' publishProfile.xml | head -1 || true)
          if [ -z "$PUBLISH_URL_RAW" ]; then
            echo "❌ publishUrl not found in publishProfile.xml"
            exit 1
          fi

          # remove scheme (ftp://, ftps://, https://, http://) and trailing path, keep host[:port]
          HOST_STRIPPED=$(echo "$PUBLISH_URL_RAW" | sed -E 's#^[^:]+://##' | cut -d'/' -f1)
          # remove credentials if present (user:pass@host)
          HOST_STRIPPED=$(echo "$HOST_STRIPPED" | awk -F'@' '{print $NF}')

          echo "publishUrl raw: $PUBLISH_URL_RAW"
          echo "host stripped: $HOST_STRIPPED"

          # derive KUDU host
          if echo "$HOST_STRIPPED" | grep -q '\.scm\.'; then
            KUDU_HOST="$HOST_STRIPPED"
          elif echo "$HOST_STRIPPED" | grep -q '\.azurewebsites\.net$'; then
            KUDU_HOST=$(echo "$HOST_STRIPPED" | sed -E 's/\.azurewebsites\.net$/.scm.azurewebsites.net/')
          else
            KUDU_HOST="$HOST_STRIPPED"
          fi

          KUDU_BASE="https://${KUDU_HOST}"
          echo "Kudu base: $KUDU_BASE"

          KUDU_USER=$(sed -n 's/.*userName="\([^"]*\)".*/\1/p' publishProfile.xml | head -1 || true)
          KUDU_PASS=$(sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' publishProfile.xml | head -1 || true)

          if [ -z "$KUDU_USER" ] || [ -z "$KUDU_PASS" ]; then
            echo "❌ Could not extract KUDU user or password from publishProfile.xml"
            exit 1
          fi

          echo "Current settings (partial):"
          curl -s -u "${KUDU_USER}:${KUDU_PASS}" "${KUDU_BASE}/api/settings" | jq '.SCM_RUN_FROM_PACKAGE, .WEBSITE_RUN_FROM_PACKAGE, .SCM_DO_BUILD_DURING_DEPLOYMENT, .ENABLE_ORYX_BUILD, .WEBSITE_NODE_DEFAULT_VERSION' || true

          echo "Removing SCM_RUN_FROM_PACKAGE (if present)..."
          curl -s -u "${KUDU_USER}:${KUDU_PASS}" -X DELETE "${KUDU_BASE}/api/settings/SCM_RUN_FROM_PACKAGE" -o /tmp/delete_scm_resp.txt -w "%{http_code}" || true
          cat /tmp/delete_scm_resp.txt || true

          echo "Setting WEBSITE_RUN_FROM_PACKAGE = 0 and disabling remote build & Oryx..."
          curl -s -u "${KUDU_USER}:${KUDU_PASS}" -X POST -H "Content-Type: application/json" \
            -d '{"WEBSITE_RUN_FROM_PACKAGE":"0","SCM_DO_BUILD_DURING_DEPLOYMENT":"false","ENABLE_ORYX_BUILD":"false"}' \
            "${KUDU_BASE}/api/settings" | jq '.' || true

          echo "Settings after change (partial):"
          curl -s -u "${KUDU_USER}:${KUDU_PASS}" "${KUDU_BASE}/api/settings" | jq '.SCM_RUN_FROM_PACKAGE, .WEBSITE_RUN_FROM_PACKAGE, .SCM_DO_BUILD_DURING_DEPLOYMENT, .ENABLE_ORYX_BUILD' || true

          echo "Restarting app via Kudu..."
          curl -s -u "${KUDU_USER}:${KUDU_PASS}" -X POST "${KUDU_BASE}/api/app/restart" -o /tmp/restart_resp.txt -w "%{http_code}" || true
          cat /tmp/restart_resp.txt || true

      - name: Deploy via Kudu ZipDeploy (using publish profile credentials)
        working-directory: api
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail

          if [ ! -f deploy_package.zip ]; then
            echo "❌ deploy_package.zip not found, aborting deploy."
            ls -la || true
            exit 1
          fi

          if [ ! -f publishProfile.xml ]; then
            echo "❌ publishProfile.xml missing. Aborting."
            exit 1
          fi

          # extract publishUrl robustly and strip any scheme/path
          PUBLISH_URL_RAW=$(sed -n 's/.*publishUrl="\([^"]*\)".*/\1/p' publishProfile.xml | head -1 || true)
          HOST_STRIPPED=$(echo "$PUBLISH_URL_RAW" | sed -E 's#^[^:]+://##' | cut -d'/' -f1)
          HOST_STRIPPED=$(echo "$HOST_STRIPPED" | awk -F'@' '{print $NF}')

          if echo "$HOST_STRIPPED" | grep -q '\.scm\.'; then
            KUDU_HOST="$HOST_STRIPPED"
          elif echo "$HOST_STRIPPED" | grep -q '\.azurewebsites\.net$'; then
            KUDU_HOST=$(echo "$HOST_STRIPPED" | sed -E 's/\.azurewebsites\.net$/.scm.azurewebsites.net/')
          else
            KUDU_HOST="$HOST_STRIPPED"
          fi

          KUDU_API="https://${KUDU_HOST}/api/zipdeploy"
          KUDU_USER=$(sed -n 's/.*userName="\([^"]*\)".*/\1/p' publishProfile.xml | head -1 || true)
          KUDU_PASS=$(sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' publishProfile.xml | head -1 || true)

          echo "Kudu API: $KUDU_API"
          echo "Deploying deploy_package.zip via Kudu..."
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/zipdeploy_result.txt -u "${KUDU_USER}:${KUDU_PASS}" \
            -X POST "$KUDU_API" --data-binary @deploy_package.zip -H "Content-Type: application/zip" || true)
          echo "Kudu response HTTP code: $HTTP_CODE"
          echo "Kudu response (first 200 lines):"
          head -n 200 /tmp/zipdeploy_result.txt || true

          if [ -z "$HTTP_CODE" ]; then
            echo "❌ No response from Kudu. Possible network/credential issue."
            cat /tmp/zipdeploy_result.txt || true
            exit 1
          fi

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Zipdeploy succeeded"
          else
            echo "❌ Zipdeploy failed with HTTP code $HTTP_CODE"
            echo "Full response:"
            cat /tmp/zipdeploy_result.txt || true
            exit 1
          fi

      - name: Remove Publish Profile file
        working-directory: api
        run: |
          set -euo pipefail
          shred -u publishProfile.xml || rm -f publishProfile.xml || true
          echo "Removed publishProfile.xml" || true

      - name: Wait for app to warm up
        run: |
          echo "Waiting a few seconds for the Function App to warm up..."
          sleep 8

      - name: Health check (optional)
        run: |
          APP_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health"
          echo "Checking $APP_URL"
          n=0
          until [ $n -ge 3 ]
          do
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$APP_URL" || echo "000")
            echo "Attempt $((n+1)): HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health endpoint OK:"
              cat /tmp/health.txt | head -n 40
              break
            fi
            n=$((n+1))
            sleep $((n * 3))
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Health check failed (last HTTP code: $HTTP_CODE). Check Function App logs in Azure Portal."
          fi
