# Workflow: build + deploy Azure Functions (usando Publish Profile)
# Requer: secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE adicionado ao repositório
name: Deploy API to Azure Functions (Publish Profile)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Publish Profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "❌ AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret not found. Add it at Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ AZURE_FUNCTIONAPP_PUBLISH_PROFILE present (length: ${#PUBLISH_PROFILE})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies & Build
        working-directory: api
        run: |
          echo "📦 Installing dependencies"
          npm ci

          echo "🔨 Building TypeScript"
          npm run build

          echo "✅ Build finished. dist/ contents:"
          ls -la dist || true

      - name: Prune devDependencies to make package lighter
        working-directory: api
        run: |
          npm prune --production || true
          du -sh node_modules || true

      - name: Verify package structure
        working-directory: api
        run: |
          echo "Checking host.json presence..."
          if [ ! -f host.json ]; then
            echo "❌ host.json not found in api/ — deploy likely to fail"
            ls -la
            exit 1
          fi
          echo "✅ host.json exists"
          echo "Listing files:"
          ls -la

      - name: Deploy to Azure Functions (Publish Profile)
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: './api'
        env:
          AZURE_FUNCTIONAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      - name: Wait for app to warm up
        run: |
          sleep 8

      - name: Health check (optional)
        run: |
          APP_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health"
          n=0
          until [ $n -ge 3 ]
          do
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$APP_URL" || echo "000")
            echo "Attempt $((n+1)): HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              cat /tmp/health.txt | head -n 40
              break
            fi
            n=$((n+1))
            sleep $((n * 3))
          done
          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Health check failed (last HTTP code: $HTTP_CODE). Check Function App logs in Azure Portal."
          fi
