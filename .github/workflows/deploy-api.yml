# Build + Pack + ZipDeploy Azure Functions using Publish Profile credentials (Kudu)
# Does NOT use RBAC / azure/login. Requires secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE
name: Deploy API to Azure Functions (Pack + Kudu ZipDeploy)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Publish Profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "❌ AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret not found. Add it at Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ AZURE_FUNCTIONAPP_PUBLISH_PROFILE present (length: ${#PUBLISH_PROFILE})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies & Build
        working-directory: api
        run: |
          echo "📦 Installing dependencies"
          npm ci

          echo "🔨 Building TypeScript"
          npm run build

          echo "✅ Build finished. dist/ contents:"
          ls -la dist || true

      - name: Prune devDependencies to make package lighter
        working-directory: api
        run: |
          npm prune --production || true
          du -sh node_modules || true

      - name: Verify package structure
        working-directory: api
        run: |
          echo "Checking host.json presence..."
          if [ ! -f host.json ]; then
            echo "❌ host.json not found in api/ — deploy likely to fail"
            ls -la
            exit 1
          fi
          echo "✅ host.json exists"
          echo "Listing files:"
          ls -la

      - name: Write Publish Profile to file
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        working-directory: api
        run: |
          echo "Saving publish profile to ./publishProfile.xml"
          printf '%s' "$PUBLISH_PROFILE" > publishProfile.xml
          echo "publishProfile.xml size: $(wc -c publishProfile.xml | awk '{print $1}') bytes"
          # show publishUrl (safe) for debug (no secrets)
          grep -oP 'publishUrl=\"[^\"]+\"' publishProfile.xml | sed -E 's/publishUrl=\"([^\"]+)\"/PublishUrl: \1/'

      - name: Install Azure Functions Core Tools (v4)
        run: |
          echo "Installing Azure Functions Core Tools v4..."
          npm i -g azure-functions-core-tools@4 --unsafe-perm true
          echo "func version: $(func --version || true)"

      - name: Create deploy package with func pack (ensure runtime env)
        working-directory: api
        env:
          FUNCTIONS_WORKER_RUNTIME: node
          WEBSITE_NODE_DEFAULT_VERSION: 20
        run: |
          set -e
          echo "ENV CHECK:"
          echo "FUNCTIONS_WORKER_RUNTIME=$FUNCTIONS_WORKER_RUNTIME"
          echo "Node version: $(node --version || true)"
          echo "func version: $(func --version || true)"
          echo ""
          echo "Packing the function app (func pack)..."
          # Try func pack; if it fails, we'll fall back to manual zip creation
          if func pack --output deploy_package.zip; then
            echo "✅ func pack succeeded"
            ls -lh deploy_package.zip
            echo "Contents (top 60 lines):"
            unzip -l deploy_package.zip | head -60 || true
            exit 0
          else
            echo "⚠️ func pack failed — will attempt manual packaging fallback"
            exit 10
          fi
        continue-on-error: true

      - name: Fallback: create manual deploy ZIP and attempt zipdeploy (runs only if func pack failed)
        if: steps.create_deploy_package_with_func_pack.outcome == 'failure' || steps.create_deploy_package_with_func_pack.conclusion == 'failure' || steps.create_deploy_package_with_func_pack.outputs['exitcode'] == '10'
        # Note: the conditional above covers usual failure cases; if GH doesn't set outputs, this step may still run — safe guard below
        working-directory: api
        run: |
          set -e
          echo "=== Manual packaging fallback ==="
          # Ensure we only proceed if deploy_package.zip not present
          if [ -f deploy_package.zip ]; then
            echo "deploy_package.zip already exists, will use it"
          else
            echo "Creating manual deploy_package.zip (host.json, package.json, package-lock.json, dist/*, node_modules)"
            rm -f deploy_package_manual.zip
            mkdir -p tmp_deploy
            cp -v host.json tmp_deploy/ || true
            cp -v package.json tmp_deploy/ || true
            cp -v package-lock.json tmp_deploy/ || true
            # copy compiled code (dist content)
            if [ -d dist ]; then
              cp -r dist/* tmp_deploy/ || true
            else
              echo "⚠️ dist/ not found — build may have failed"
            fi
            # copy prod node_modules (pruned)
            if [ -d node_modules ]; then
              cp -r node_modules tmp_deploy/ || true
            fi
            cd tmp_deploy
            zip -r ../deploy_package.zip . -x "*.git*" -x "*.ts" -x "tsconfig.json" -x "*.test.js" -x "tests/*" -x ".env*" -x "node_modules/@types/*"
            cd ..
            ls -lh deploy_package.zip
            echo "Manual package contents (top 80):"
            unzip -l deploy_package.zip | head -80 || true
          fi

      - name: Extract Kudu credentials from publishProfile and zipdeploy
        working-directory: api
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          set -e
          echo "Extracting Kudu credentials from publishProfile.xml (no secret echo)..."

          PUBLISH_URL_RAW=$(grep -oP 'publishUrl=\"[^\"]+\"' publishProfile.xml | head -1 | cut -d'\"' -f2)
          if [ -z "$PUBLISH_URL_RAW" ]; then
            echo "❌ Could not find publishUrl in publishProfile.xml"
            exit 1
          fi
          # remove trailing :port if any
          SCM_HOST=$(echo "$PUBLISH_URL_RAW" | sed -E 's/:[0-9]+$//')
          KUDU_API="https://${SCM_HOST}/api/zipdeploy"
          echo "Kudu API: $KUDU_API"

          KUDU_USER=$(grep -oP 'userName=\"[^\"]+\"' publishProfile.xml | head -1 | cut -d'\"' -f2)
          KUDU_PASS=$(grep -oP 'userPWD=\"[^\"]+\"' publishProfile.xml | head -1 | cut -d'\"' -f2)

          if [ -z "$KUDU_USER" ] || [ -z "$KUDU_PASS" ]; then
            echo "❌ Could not extract Kudu user/password from publishProfile.xml"
            exit 1
          fi

          echo "Deploying deploy_package.zip via Kudu..."
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/zipdeploy_result.txt -u "${KUDU_USER}:${KUDU_PASS}" \
            -X POST "$KUDU_API" --data-binary @deploy_package.zip -H "Content-Type: application/zip")
          echo "Kudu response HTTP code: $HTTP_CODE"
          echo "Kudu response (first 200 lines):"
          head -n 200 /tmp/zipdeploy_result.txt || true

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Zipdeploy succeeded"
          else
            echo "❌ Zipdeploy failed with HTTP code $HTTP_CODE"
            echo "Full response:"
            cat /tmp/zipdeploy_result.txt || true
            exit 1
          fi

      - name: Remove Publish Profile file
        working-directory: api
        run: |
          shred -u publishProfile.xml || rm -f publishProfile.xml || true
          echo "Removed publishProfile.xml" || true

      - name: Wait for app to warm up
        run: |
          echo "Waiting a few seconds for the Function App to warm up..."
          sleep 8

      - name: Health check (optional)
        run: |
          APP_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health"
          echo "Checking $APP_URL"
          n=0
          until [ $n -ge 3 ]
          do
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$APP_URL" || echo "000")
            echo "Attempt $((n+1)): HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health endpoint OK:"
              cat /tmp/health.txt | head -n 40
              break
            fi
            n=$((n+1))
            sleep $((n * 3))
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️ Health check failed (last HTTP code: $HTTP_CODE). Check Function App logs in Azure Portal."
          fi
