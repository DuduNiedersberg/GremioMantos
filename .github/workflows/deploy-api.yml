name: Deploy Azure Functions API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'api'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 'Checkout código'
      uses: actions/checkout@v4

    - name: 'Setup Node.js ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Validar configuração'
      run: |
        echo "🔍 Verificando configuração..."
        
        if [ -z "${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}" ]; then
          echo "❌ Secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE não encontrado!"
          echo ""
          echo "Configure em: Settings → Secrets → Actions"
          echo "Nome: AZURE_FUNCTIONAPP_PUBLISH_PROFILE"
          echo "Valor: Cole todo o conteúdo XML do arquivo .PublishSettings"
          exit 1
        fi
        
        echo "✅ Publish profile configurado"
        echo "✅ Function App: ${{ env.AZURE_FUNCTIONAPP_NAME }}"
        echo "✅ Node version: ${{ env.NODE_VERSION }}"

    - name: 'Instalar dependências'
      shell: bash
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      run: |
        echo "📦 Instalando dependências..."
        npm ci
        echo "✅ Dependências instaladas"

    - name: 'Build TypeScript'
      shell: bash
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      run: |
        echo "🔨 Compilando TypeScript..."
        npm run build
        
        echo "📋 Arquivos gerados:"
        ls -la dist/ || ls -la
        
        echo "✅ Build concluído!"

    - name: 'Preparar para deploy'
      shell: bash
      working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      run: |
        echo "🧹 Removendo dev dependencies..."
        npm prune --production
        
        echo "📦 Estrutura final:"
        ls -la
        
        if [ -f "host.json" ]; then
          echo "✅ host.json encontrado"
        else
          echo "⚠️ host.json não encontrado!"
        fi

    - name: 'Deploy para Azure Functions'
      uses: Azure/functions-action@v1
      id: deploy
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

    - name: 'Aguardar inicialização'
      run: |
        echo "⏳ Aguardando cold start da Function App..."
        echo "Isso pode levar até 2 minutos..."
        sleep 90

    - name: 'Health Check'
      run: |
        echo "🔍 Testando endpoints..."
        
        BASE_URL="https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net"
        
        # Testar health endpoint
        for i in {1..10}; do
          echo ""
          echo "Tentativa $i/10 - Health check..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" "$BASE_URL/api/health" || echo "error")
          
          if [ "$RESPONSE" = "error" ]; then
            echo "❌ Erro na conexão"
          else
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)
            
            echo "Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Health check passou!"
              echo "Resposta: $BODY"
              echo ""
              echo "🎉 Deploy concluído com sucesso!"
              echo "🔗 URL: $BASE_URL"
              exit 0
            else
              echo "Body: $BODY"
            fi
          fi
          
          if [ $i -lt 10 ]; then
            echo "Aguardando 15s antes de tentar novamente..."
            sleep 15
          fi
        done
        
        echo ""
        echo "⚠️ Health check não passou após 10 tentativas"
        echo ""
        echo "🔍 Verificações manuais:"
        echo "1. URL: $BASE_URL/api/health"
        echo "2. Azure Portal → Function App → Functions (verificar se aparecem listadas)"
        echo "3. Azure Portal → Log Stream (ver logs em tempo real)"
        echo ""
        echo "Mas o deploy foi feito! Pode ser apenas cold start demorado."
        exit 1

    - name: 'Listar funções disponíveis'
      if: success()
      run: |
        echo ""
        echo "📋 Testando outras funções disponíveis..."
        
        BASE_URL="https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net"
        
        # Tentar listar funções (pode não funcionar se não tiver esse endpoint)
        curl -s "$BASE_URL/api/functions" || echo "Endpoint /api/functions não disponível"
        
        echo ""
        echo "✅ Pipeline concluída!"
