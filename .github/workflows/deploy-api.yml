# Build + Pack + ZipDeploy Azure Functions using Publish Profile credentials (Kudu)
# Does NOT use RBAC / azure/login. Requires secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE
name: Deploy API to Azure Functions (Pack + Kudu ZipDeploy)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Publish Profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "${PUBLISH_PROFILE:-}" ]; then
            echo "❌ AZURE_FUNCTIONAPP_PUBLISH_PROFILE secret not found. Add it at Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ AZURE_FUNCTIONAPP_PUBLISH_PROFILE present (length: ${#PUBLISH_PROFILE})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies & Build
        working-directory: api
        run: |
          set -euo pipefail
          echo "📦 Installing dependencies"
          npm ci

          echo "🔨 Building TypeScript"
          npm run build

          echo "✅ Build finished. dist/ contents:"
          ls -la dist || true

      - name: Prune devDependencies to make package lighter
        working-directory: api
        run: |
          set -euo pipefail
          npm prune --production || true
          du -sh node_modules || true

      - name: Verify package structure
        working-directory: api
        run: |
          set -euo pipefail
          echo "Checking host.json presence..."
          if [ ! -f host.json ]; then
            echo "❌ host.json not found in api/ — deploy likely to fail"
            ls -la
            exit 1
          fi
          echo "✅ host.json exists"
          echo "Listing files:"
          ls -la

      - name: Write Publish Profile to file
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        working-directory: api
        run: |
          set -euo pipefail
          echo "Saving publish profile to ./publishProfile.xml"
          printf '%s' "$PUBLISH_PROFILE" > publishProfile.xml
          echo "publishProfile.xml size: $(wc -c publishProfile.xml | awk '{print $1}') bytes"
          sed -n 's/.*publishUrl="\([^"]*\)".*/PublishUrl: \1/p' publishProfile.xml | head -1 || true

      - name: Install system packages (zip, jq)
        run: |
          set -euo pipefail
          echo "Installing zip/unzip/jq (required for packaging and debug)..."
          sudo apt-get update -y
          sudo apt-get install -y zip unzip jq || true
          echo "zip version: $(zip -v 2>/dev/null | head -n 1 || true)"
          echo "unzip version: $(unzip -v 2>/dev/null | head -n 1 || true)"

      - name: Create deploy package (manual ZIP with correct structure)
        working-directory: api
        run: |
          set -euo pipefail
          echo "Creating deploy package with correct structure..."
          
          # Cleanup
          rm -f deploy_package.zip || true
          rm -rf deploy_package || true
          
          # Create temporary directory
          mkdir -p deploy_package
          
          # Copy files to root of package
          echo "Copying files..."
          cp host.json deploy_package/
          cp package.json deploy_package/
          cp package-lock.json deploy_package/
          
          # Copy contents of dist to root (NOT the dist folder itself)
          if [ -d dist ]; then
            echo "Copying dist contents to root..."
            cp -r dist/* deploy_package/
          else
            echo "❌ dist/ not found"
            exit 1
          fi
          
          # Copy node_modules
          if [ -d node_modules ]; then
            echo "Copying node_modules..."
            cp -r node_modules deploy_package/
          fi
          
          # Show structure before zipping
          echo ""
          echo "Structure before zipping:"
          cd deploy_package
          ls -la
          
          echo ""
          echo "Functions found:"
          find . -name "function.json" -type f
          
          # Create ZIP from inside deploy_package
          echo ""
          echo "Creating ZIP..."
          zip -r ../deploy_package.zip . \
            -x "*.git*" \
            -x "*.ts" \
            -x "tsconfig.json" \
            -x "*.test.js" \
            -x "tests/*" \
            -x ".env*" \
            -x "node_modules/@types/*"
          
          cd ..
          
          echo ""
          echo "✅ deploy_package.zip created"
          ls -lh deploy_package.zip
          
          echo ""
          echo "ZIP contents (first 50 files):"
          unzip -l deploy_package.zip | head -50
          
          echo ""
          echo "Verifying structure:"
          echo "1. host.json in root:"
          unzip -l deploy_package.zip | grep "^\s*[0-9].*\shost\.json$" || echo "❌ NOT FOUND"
          
          echo "2. function.json files:"
          unzip -l deploy_package.zip | grep "function\.json$" || echo "❌ NONE FOUND"

      - name: CRITICAL - Remove SCM_RUN_FROM_PACKAGE and disable remote build
        working-directory: api
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          AZURE_FUNCTIONAPP_NAME: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        run: |
          set -euo pipefail

          if [ ! -f publishProfile.xml ]; then
            echo "❌ publishProfile.xml missing. Aborting."
            exit 1
          fi

          # Extract Kudu credentials
          mapfile -t URLS < <(grep -oP 'publishUrl="[^"]+"' publishProfile.xml | sed -E 's/publishUrl="([^"]+)"/\1/')
          CHOSEN=""
          for u in "${URLS[@]}"; do
            hs=$(echo "$u" | sed -E 's#^[^:]+://##' | cut -d'/' -f1)
            hs=$(echo "$hs" | awk -F'@' '{print $NF}')
            if echo "$hs" | grep -qiE 'ftp|waws-prod'; then
              continue
            fi
            if echo "$hs" | grep -q '\.scm\.'; then
              CHOSEN="$hs"
              break
            fi
            if echo "$hs" | grep -q '\.azurewebsites\.net'; then
              CHOSEN="$hs"
              break
            fi
          done

          if [ -z "$CHOSEN" ]; then
            echo "No suitable publishUrl found; using fallback"
            CHOSEN="${AZURE_FUNCTIONAPP_NAME}.scm.brazilsouth-01.azurewebsites.net"
          fi

          if echo "$CHOSEN" | grep -q '\.scm\.'; then
            KUDU_HOST="$CHOSEN"
          elif echo "$CHOSEN" | grep -q '\.azurewebsites\.net$'; then
            KUDU_HOST=$(echo "$CHOSEN" | sed -E 's/\.azurewebsites\.net$/.scm.brazilsouth-01.azurewebsites.net/')
          else
            KUDU_HOST="$CHOSEN"
          fi

          KUDU_BASE="https://${KUDU_HOST}"
          echo "Kudu base: $KUDU_BASE"

          KUDU_USER=$(sed -n 's/.*userName="\([^"]*\)".*/\1/p' publishProfile.xml | head -1 || true)
          KUDU_PASS=$(sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' publishProfile.xml | head -1 || true)

          if [ -z "$KUDU_USER" ] || [ -z "$KUDU_PASS" ]; then
            echo "❌ Could not extract KUDU credentials"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "STEP 1: Check current settings"
          echo "=========================================="
          curl -s -u "${KUDU_USER}:${KUDU_PASS}" "${KUDU_BASE}/api/settings" | \
            jq '{SCM_RUN_FROM_PACKAGE, WEBSITE_RUN_FROM_PACKAGE, SCM_DO_BUILD_DURING_DEPLOYMENT, ENABLE_ORYX_BUILD}' || true

          echo ""
          echo "=========================================="
          echo "STEP 2: DELETE SCM_RUN_FROM_PACKAGE"
          echo "=========================================="
          HTTP_CODE=$(curl -s -u "${KUDU_USER}:${KUDU_PASS}" \
            -X DELETE "${KUDU_BASE}/api/settings/SCM_RUN_FROM_PACKAGE" \
            -w "%{http_code}" -o /tmp/delete_scm.txt)
          echo "HTTP Code: $HTTP_CODE"
          cat /tmp/delete_scm.txt || true

          echo ""
          echo "=========================================="
          echo "STEP 3: Set WEBSITE_RUN_FROM_PACKAGE=0 and disable builds"
          echo "=========================================="
          curl -s -u "${KUDU_USER}:${KUDU_PASS}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"WEBSITE_RUN_FROM_PACKAGE":"0","SCM_DO_BUILD_DURING_DEPLOYMENT":"false","ENABLE_ORYX_BUILD":"false"}' \
            "${KUDU_BASE}/api/settings" | jq '.' || true

          sleep 3

          echo ""
          echo "=========================================="
          echo "STEP 4: Verify settings changed"
          echo "=========================================="
          SETTINGS=$(curl -s -u "${KUDU_USER}:${KUDU_PASS}" "${KUDU_BASE}/api/settings")
          
          echo "$SETTINGS" | jq '{SCM_RUN_FROM_PACKAGE, WEBSITE_RUN_FROM_PACKAGE, SCM_DO_BUILD_DURING_DEPLOYMENT, ENABLE_ORYX_BUILD}' || true
          
          # Check if SCM_RUN_FROM_PACKAGE still exists
          if echo "$SETTINGS" | grep -q '"SCM_RUN_FROM_PACKAGE"'; then
            echo ""
            echo "⚠️ WARNING: SCM_RUN_FROM_PACKAGE still exists!"
            echo "This will block zipdeploy. Trying alternative method..."
            
            # Try setting it to empty string
            curl -s -u "${KUDU_USER}:${KUDU_PASS}" \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"SCM_RUN_FROM_PACKAGE":""}' \
              "${KUDU_BASE}/api/settings" || true
            
            sleep 2
          else
            echo "✅ SCM_RUN_FROM_PACKAGE successfully removed"
          fi

          echo ""
          echo "=========================================="
          echo "STEP 5: Restart app to apply changes"
          echo "=========================================="
          HTTP_CODE=$(curl -s -u "${KUDU_USER}:${KUDU_PASS}" \
            -X POST "${KUDU_BASE}/api/app/restart" \
            -w "%{http_code}" -o /tmp/restart.txt)
          echo "Restart HTTP Code: $HTTP_CODE"
          cat /tmp/restart.txt || true

          echo ""
          echo "Waiting 15s for restart..."
          sleep 15

          echo ""
          echo "=========================================="
          echo "STEP 6: Final verification"
          echo "=========================================="
          curl -s -u "${KUDU_USER}:${KUDU_PASS}" "${KUDU_BASE}/api/settings" | \
            jq '{SCM_RUN_FROM_PACKAGE, WEBSITE_RUN_FROM_PACKAGE, SCM_DO_BUILD_DURING_DEPLOYMENT, ENABLE_ORYX_BUILD}' || true

      - name: Test if zipdeploy endpoint is available
        working-directory: api
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          AZURE_FUNCTIONAPP_NAME: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        run: |
          set -euo pipefail

          KUDU_USER=$(sed -n 's/.*userName="\([^"]*\)".*/\1/p' publishProfile.xml | head -1)
          KUDU_PASS=$(sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' publishProfile.xml | head -1)
          KUDU_BASE="https://${AZURE_FUNCTIONAPP_NAME}.scm.brazilsouth-01.azurewebsites.net"

          echo "Testing if /api/zipdeploy is available..."
          HTTP_CODE=$(curl -s -u "${KUDU_USER}:${KUDU_PASS}" \
            -X GET "${KUDU_BASE}/api/zipdeploy" \
            -w "%{http_code}" -o /tmp/test_zipdeploy.txt)
          
          echo "HTTP Code: $HTTP_CODE"
          cat /tmp/test_zipdeploy.txt || true
          
          if grep -q "No route registered" /tmp/test_zipdeploy.txt 2>/dev/null; then
            echo ""
            echo "❌ ERROR: zipdeploy endpoint still not available!"
            echo "SCM_RUN_FROM_PACKAGE might still be active or app didn't restart properly"
            echo ""
            echo "Checking settings one more time:"
            curl -s -u "${KUDU_USER}:${KUDU_PASS}" "${KUDU_BASE}/api/settings" | \
              jq '{SCM_RUN_FROM_PACKAGE, WEBSITE_RUN_FROM_PACKAGE}' || true
            exit 1
          fi
          
          echo "✅ Zipdeploy endpoint is available"

      - name: Deploy via Kudu ZipDeploy (Method 1 - Standard)
        working-directory: api
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          AZURE_FUNCTIONAPP_NAME: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        run: |
          set -euo pipefail

          if [ ! -f deploy_package.zip ]; then
            echo "❌ deploy_package.zip not found"
            exit 1
          fi

          KUDU_USER=$(sed -n 's/.*userName="\([^"]*\)".*/\1/p' publishProfile.xml | head -1)
          KUDU_PASS=$(sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' publishProfile.xml | head -1)
          KUDU_API="https://${AZURE_FUNCTIONAPP_NAME}.scm.brazilsouth-01.azurewebsites.net/api/zipdeploy"

          echo "Deploying to: $KUDU_API"
          echo "Package size: $(stat -c%s deploy_package.zip || stat -f%z deploy_package.zip) bytes"

          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/zipdeploy_result.txt \
            -u "${KUDU_USER}:${KUDU_PASS}" \
            -X POST "$KUDU_API" \
            --data-binary @deploy_package.zip \
            -H "Content-Type: application/zip" \
            --max-time 600)
          
          echo "HTTP Code: $HTTP_CODE"
          echo "Response:"
          cat /tmp/zipdeploy_result.txt || true

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ ZipDeploy succeeded!"
            echo "DEPLOY_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "❌ ZipDeploy failed with HTTP $HTTP_CODE"
            echo "Trying alternative method..."
            echo "DEPLOY_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Deploy via Alternative Method (if standard failed)
        if: env.DEPLOY_SUCCESS != 'true'
        working-directory: api
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          AZURE_FUNCTIONAPP_NAME: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        run: |
          set -euo pipefail

          KUDU_USER=$(sed -n 's/.*userName="\([^"]*\)".*/\1/p' publishProfile.xml | head -1)
          KUDU_PASS=$(sed -n 's/.*userPWD="\([^"]*\)".*/\1/p' publishProfile.xml | head -1)
          KUDU_BASE="https://${AZURE_FUNCTIONAPP_NAME}.scm.brazilsouth-01.azurewebsites.net"

          echo "Trying VFS ZIP method..."
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/vfs_result.txt \
            -u "${KUDU_USER}:${KUDU_PASS}" \
            -X PUT "${KUDU_BASE}/api/zip/site/wwwroot/" \
            --data-binary @deploy_package.zip \
            -H "Content-Type: application/zip" \
            --max-time 600)
          
          echo "HTTP Code: $HTTP_CODE"
          cat /tmp/vfs_result.txt || true

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ VFS deployment succeeded!"
            
            echo "Syncing triggers..."
            curl -s -u "${KUDU_USER}:${KUDU_PASS}" \
              -X POST "${KUDU_BASE}/api/functions/synctriggers"
            
            echo "DEPLOY_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "❌ Alternative method also failed"
            exit 1
          fi

      - name: Remove Publish Profile file
        if: always()
        working-directory: api
        run: |
          set -euo pipefail
          shred -u publishProfile.xml || rm -f publishProfile.xml || true
          echo "Removed publishProfile.xml"

      - name: Wait for app to warm up
        if: env.DEPLOY_SUCCESS == 'true'
        run: |
          echo "Waiting for Function App to warm up..."
          sleep 20

      - name: Health check
        if: env.DEPLOY_SUCCESS == 'true'
        run: |
          APP_URL="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.brazilsouth-01.azurewebsites.net/api/health"
          echo "Checking $APP_URL"
          
          for i in {1..5}; do
            echo "Attempt $i/5..."
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" "$APP_URL" || echo "000")
            echo "HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check OK:"
              cat /tmp/health.txt
              exit 0
            fi
            
            sleep 10
          done

          echo "⚠️ Health check failed. Check Azure Portal logs."
          echo "Last response:"
          cat /tmp/health.txt || true
