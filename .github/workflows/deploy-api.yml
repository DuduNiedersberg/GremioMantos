name: Deploy Azure Functions API (Kudu Direto)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 'Checkout código'
      uses: actions/checkout@v4

    - name: 'Setup Node.js ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Validar secrets'
      env:
        TEST_USERNAME: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        TEST_PASSWORD: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🔐 Validando configuração..."
        
        echo "Debug info:"
        echo "Username env var length: ${#TEST_USERNAME}"
        echo "Password env var length: ${#TEST_PASSWORD}"
        
        if [ -z "$TEST_USERNAME" ]; then
          echo "❌ AZURE_DEPLOY_USERNAME não configurado ou vazio!"
          echo ""
          echo "Verifique:"
          echo "1. GitHub → Settings → Secrets and variables → Actions"
          echo "2. Deve existir: AZURE_DEPLOY_USERNAME (exatamente assim, maiúsculo)"
          echo "3. Se existir, delete e crie novamente"
          exit 1
        fi
        
        if [ -z "$TEST_PASSWORD" ]; then
          echo "❌ AZURE_DEPLOY_PASSWORD não configurado ou vazio!"
          echo ""
          echo "Verifique:"
          echo "1. GitHub → Settings → Secrets and variables → Actions"
          echo "2. Deve existir: AZURE_DEPLOY_PASSWORD (exatamente assim, maiúsculo)"
          echo "3. Se existir, delete e crie novamente"
          exit 1
        fi
        
        echo "✅ Secrets configurados corretamente"
        echo "Username começa com: ${TEST_USERNAME:0:2}..."
        echo "Password length: ${#TEST_PASSWORD} caracteres"

    - name: 'Testar autenticação Kudu'
      env:
        KUDU_USER: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        KUDU_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🧪 Testando autenticação..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        echo "Tentando conectar ao Kudu..."
        echo "Username primeiro caractere: ${KUDU_USER:0:1}"
        echo "Username length: ${#KUDU_USER}"
        echo "Password length: ${#KUDU_PASS}"
        
        # Teste com --user em vez de -u
        HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/test.txt \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/settings")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "✅ Autenticação funcionando!"
          echo "Settings retornados:"
          cat /tmp/test.txt | head -20
        elif [ "$HTTP_CODE" -eq 401 ]; then
          echo "❌ Erro 401 - Credenciais inválidas!"
          echo ""
          echo "Response body:"
          cat /tmp/test.txt
          echo ""
          echo "Tentando formato alternativo de autenticação..."
          
          # Tentar com base64 manual
          AUTH_HEADER=$(echo -n "${KUDU_USER}:${KUDU_PASS}" | base64)
          
          HTTP_CODE2=$(curl -s -w "%{http_code}" -o /tmp/test2.txt \
            -H "Authorization: Basic ${AUTH_HEADER}" \
            "$KUDU_URL/api/settings")
          
          echo "Tentativa 2 - HTTP Status: $HTTP_CODE2"
          
          if [ "$HTTP_CODE2" -eq 200 ]; then
            echo "✅ Funcionou com header manual!"
            cat /tmp/test2.txt | head -20
          else
            echo "❌ Também falhou"
            echo ""
            echo "Debugging:"
            echo "1. Confirme que copiou username E password sem espaços extras"
            echo "2. Username esperado deve começar com \$ ou conter \$"
            echo "3. Tente resetar as credenciais no Azure:"
            echo "   az functionapp deployment user set --user-name <novo-nome> --password <nova-senha>"
            exit 1
          fi
        else
          echo "⚠️ Status inesperado: $HTTP_CODE"
          cat /tmp/test.txt
          exit 1
        fi

    - name: 'Remover WEBSITE_RUN_FROM_PACKAGE'
      env:
        KUDU_USER: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        KUDU_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🔧 Desabilitando WEBSITE_RUN_FROM_PACKAGE..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        # Primeiro, setar como 0 (desabilitar)
        echo "Setando WEBSITE_RUN_FROM_PACKAGE=0..."
        curl -X POST \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          -H "Content-Type: application/json" \
          -d '{"WEBSITE_RUN_FROM_PACKAGE":"0"}' \
          "$KUDU_URL/api/settings"
        
        sleep 5
        
        # Depois tentar deletar
        echo "Tentando deletar WEBSITE_RUN_FROM_PACKAGE..."
        curl -X DELETE \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/settings/WEBSITE_RUN_FROM_PACKAGE"
        
        sleep 5
        
        # Verificar
        echo "Verificando configuração atual..."
        SETTINGS=$(curl -s --user "${KUDU_USER}:${KUDU_PASS}" "$KUDU_URL/api/settings")
        
        if echo "$SETTINGS" | grep -q "WEBSITE_RUN_FROM_PACKAGE"; then
          PACKAGE_VALUE=$(echo "$SETTINGS" | grep -o '"WEBSITE_RUN_FROM_PACKAGE":"[^"]*"' | cut -d'"' -f4)
          echo "⚠️ WEBSITE_RUN_FROM_PACKAGE ainda existe com valor: $PACKAGE_VALUE"
          
          if [ "$PACKAGE_VALUE" = "0" ]; then
            echo "✅ Mas está desabilitado (valor = 0), pode prosseguir"
          else
            echo "⚠️ Tentando forçar valor 0 novamente..."
            curl -X POST \
              --user "${KUDU_USER}:${KUDU_PASS}" \
              -H "Content-Type: application/json" \
              -d '{"WEBSITE_RUN_FROM_PACKAGE":"0"}' \
              "$KUDU_URL/api/settings"
          fi
        else
          echo "✅ WEBSITE_RUN_FROM_PACKAGE não existe"
        fi

    - name: 'Build da aplicação'
      working-directory: api
      run: |
        echo "📦 Instalando dependências..."
        npm ci
        
        echo "🔨 Compilando TypeScript..."
        npm run build
        
        echo "✅ Build concluído!"

    - name: 'Preparar pacote ZIP'
      working-directory: api
      run: |
        echo "📦 Criando pacote de deploy..."
        
        # Remover dev dependencies
        npm prune --production
        
        # Criar ZIP com tudo
        zip -r deploy.zip . \
          -x "*.git*" \
          -x "*.ts" \
          -x "tsconfig.json" \
          -x "*.test.js" \
          -x "tests/*" \
          -x ".env*"
        
        echo "✅ ZIP criado:"
        ls -lh deploy.zip
        
        echo ""
        echo "📋 Primeiros 50 arquivos no ZIP:"
        unzip -l deploy.zip | head -50

    - name: 'Deploy via Kudu ZipDeploy'
      working-directory: api
      run: |
        echo "🚀 Fazendo deploy..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        HTTP_CODE=$(curl -X POST \
          -u "${{ secrets.AZURE_DEPLOY_USERNAME }}:${{ secrets.AZURE_DEPLOY_PASSWORD }}" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/zip" \
          -w "%{http_code}" \
          -o response.txt \
          --max-time 600 \
          -v \
          "$KUDU_URL/api/zipdeploy")
        
        echo ""
        echo "HTTP Status: $HTTP_CODE"
        
        if [ -f response.txt ]; then
          echo "Response body:"
          cat response.txt
        fi
        
        if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
          echo ""
          echo "✅ Deploy iniciado com sucesso!"
        else
          echo ""
          echo "❌ Deploy falhou com código $HTTP_CODE"
          exit 1
        fi

    - name: 'Verificar status do deployment'
      run: |
        echo "⏳ Aguardando conclusão do deployment..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        for i in {1..20}; do
          echo "Verificação $i/20..."
          
          LATEST=$(curl -s \
            -u "${{ secrets.AZURE_DEPLOY_USERNAME }}:${{ secrets.AZURE_DEPLOY_PASSWORD }}" \
            "$KUDU_URL/api/deployments/latest")
          
          STATUS=$(echo "$LATEST" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
          PROGRESS=$(echo "$LATEST" | jq -r '.progress // ""' 2>/dev/null || echo "")
          
          echo "Status: $STATUS"
          if [ -n "$PROGRESS" ]; then
            echo "Progress: $PROGRESS"
          fi
          
          if [ "$STATUS" = "4" ] || [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment completo!"
            break
          elif [ "$STATUS" = "3" ] || [ "$STATUS" = "Failed" ]; then
            echo "❌ Deployment falhou!"
            echo "$LATEST" | jq '.'
            exit 1
          fi
          
          sleep 10
        done

    - name: 'Aguardar cold start'
      run: |
        echo "⏳ Aguardando inicialização da Function App (90s)..."
        sleep 90

    - name: 'Health Check'
      run: |
        echo "🔍 Testando endpoints..."
        
        BASE_URL="https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net"
        
        for i in {1..10}; do
          echo ""
          echo "Tentativa $i/10..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" "$BASE_URL/api/health" 2>/dev/null || echo -e "\nerror")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passou!"
            echo "Resposta: $BODY"
            echo ""
            echo "🎉 Deploy concluído com sucesso!"
            echo "🔗 Function App: $BASE_URL"
            exit 0
          elif [ "$HTTP_CODE" != "error" ]; then
            echo "Body: $BODY"
          fi
          
          if [ $i -lt 10 ]; then
            echo "Aguardando 15s..."
            sleep 15
          fi
        done
        
        echo ""
        echo "⚠️ Health check não passou após 10 tentativas"
        echo "Verifique manualmente: $BASE_URL/api/health"
