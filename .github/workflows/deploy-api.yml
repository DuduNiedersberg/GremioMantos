name: Deploy Azure Functions API (Kudu Direto - TESTE)

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: gremiomantosapi
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 'Checkout código'
      uses: actions/checkout@v4

    - name: 'Setup Node.js ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: 'Validar secrets'
      env:
        TEST_USERNAME: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        TEST_PASSWORD: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🔐 Validando configuração..."
        
        echo "Debug info:"
        echo "Username env var length: ${#TEST_USERNAME}"
        echo "Password env var length: ${#TEST_PASSWORD}"
        
        if [ -z "$TEST_USERNAME" ]; then
          echo "❌ AZURE_DEPLOY_USERNAME não configurado ou vazio!"
          echo ""
          echo "Verifique:"
          echo "1. GitHub → Settings → Secrets and variables → Actions"
          echo "2. Deve existir: AZURE_DEPLOY_USERNAME (exatamente assim, maiúsculo)"
          echo "3. Se existir, delete e crie novamente"
          exit 1
        fi
        
        if [ -z "$TEST_PASSWORD" ]; then
          echo "❌ AZURE_DEPLOY_PASSWORD não configurado ou vazio!"
          echo ""
          echo "Verifique:"
          echo "1. GitHub → Settings → Secrets and variables → Actions"
          echo "2. Deve existir: AZURE_DEPLOY_PASSWORD (exatamente assim, maiúsculo)"
          echo "3. Se existir, delete e crie novamente"
          exit 1
        fi
        
        echo "✅ Secrets configurados corretamente"
        echo "Username começa com: ${TEST_USERNAME:0:2}..."
        echo "Password length: ${#TEST_PASSWORD} caracteres"

    - name: 'Testar autenticação Kudu'
      env:
        KUDU_USER: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        KUDU_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🧪 Testando autenticação..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        echo "Tentando conectar ao Kudu..."
        echo "Username primeiro caractere: ${KUDU_USER:0:1}"
        echo "Username length: ${#KUDU_USER}"
        echo "Password length: ${#KUDU_PASS}"
        
        HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/test.txt \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/settings")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ "$HTTP_CODE" -eq 200 ]; then
          echo "✅ Autenticação funcionando!"
          echo "Settings retornados:"
          cat /tmp/test.txt | head -20
        elif [ "$HTTP_CODE" -eq 401 ]; then
          echo "❌ Erro 401 - Credenciais inválidas!"
          echo ""
          echo "Response body:"
          cat /tmp/test.txt
          echo ""
          echo "Tentando formato alternativo de autenticação..."
          
          AUTH_HEADER=$(echo -n "${KUDU_USER}:${KUDU_PASS}" | base64)
          
          HTTP_CODE2=$(curl -s -w "%{http_code}" -o /tmp/test2.txt \
            -H "Authorization: Basic ${AUTH_HEADER}" \
            "$KUDU_URL/api/settings")
          
          echo "Tentativa 2 - HTTP Status: $HTTP_CODE2"
          
          if [ "$HTTP_CODE2" -eq 200 ]; then
            echo "✅ Funcionou com header manual!"
            cat /tmp/test2.txt | head -20
          else
            echo "❌ Também falhou"
            exit 1
          fi
        else
          echo "⚠️ Status inesperado: $HTTP_CODE"
          cat /tmp/test.txt
          exit 1
        fi

    - name: 'Verificar configurações Azure Functions'
      env:
        KUDU_USER: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        KUDU_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🔍 Verificando configurações da Function App..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        echo "1. Settings atuais:"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/settings" | jq '.' 2>/dev/null || \
          curl -s --user "${KUDU_USER}:${KUDU_PASS}" "$KUDU_URL/api/settings"
        
        echo ""
        echo "2. Versão do runtime:"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/diagnostics/runtime" | jq '.' 2>/dev/null || \
          curl -s --user "${KUDU_USER}:${KUDU_PASS}" "$KUDU_URL/api/diagnostics/runtime"
        
        echo ""
        echo "3. Verificar se /site/wwwroot existe e conteúdo:"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/vfs/site/wwwroot/" | head -50

    - name: 'Remover WEBSITE_RUN_FROM_PACKAGE'
      env:
        KUDU_USER: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        KUDU_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🔧 Desabilitando WEBSITE_RUN_FROM_PACKAGE..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        echo "Setando WEBSITE_RUN_FROM_PACKAGE=0..."
        curl -X POST \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          -H "Content-Type: application/json" \
          -d '{"WEBSITE_RUN_FROM_PACKAGE":"0"}' \
          "$KUDU_URL/api/settings"
        
        sleep 5
        
        echo "Tentando deletar WEBSITE_RUN_FROM_PACKAGE..."
        curl -X DELETE \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/settings/WEBSITE_RUN_FROM_PACKAGE"
        
        sleep 5
        
        echo "Verificando configuração atual..."
        SETTINGS=$(curl -s --user "${KUDU_USER}:${KUDU_PASS}" "$KUDU_URL/api/settings")
        
        if echo "$SETTINGS" | grep -q "WEBSITE_RUN_FROM_PACKAGE"; then
          PACKAGE_VALUE=$(echo "$SETTINGS" | grep -o '"WEBSITE_RUN_FROM_PACKAGE":"[^"]*"' | cut -d'"' -f4)
          echo "⚠️ WEBSITE_RUN_FROM_PACKAGE ainda existe com valor: $PACKAGE_VALUE"
          
          if [ "$PACKAGE_VALUE" = "0" ]; then
            echo "✅ Mas está desabilitado (valor = 0), pode prosseguir"
          else
            echo "⚠️ Tentando forçar valor 0 novamente..."
            curl -X POST \
              --user "${KUDU_USER}:${KUDU_PASS}" \
              -H "Content-Type: application/json" \
              -d '{"WEBSITE_RUN_FROM_PACKAGE":"0"}' \
              "$KUDU_URL/api/settings"
          fi
        else
          echo "✅ WEBSITE_RUN_FROM_PACKAGE não existe"
        fi

    - name: 'Build da aplicação'
      working-directory: api
      run: |
        echo "📦 Instalando dependências..."
        npm ci
        
        echo "🔨 Compilando TypeScript..."
        npm run build
        
        echo "✅ Build concluído!"
        
        echo ""
        echo "Verificando estrutura de dist após build:"
        ls -la dist/

    - name: 'Preparar pacote ZIP'
      working-directory: api
      run: |
        echo "📦 Criando pacote de deploy..."
        
        echo "Estrutura do projeto:"
        ls -la
        
        echo ""
        echo "Conteúdo de dist/:"
        ls -la dist/
        
        echo ""
        echo "Removendo dev dependencies..."
        npm prune --production
        
        echo ""
        echo "Preparando estrutura de deploy..."
        mkdir -p deploy_package
        
        # Copiar host.json e package files para raiz
        cp host.json deploy_package/
        cp package.json deploy_package/
        cp package-lock.json deploy_package/
        
        # IMPORTANTE: Copiar CONTEÚDO de dist (não a pasta) para raiz
        echo "Copiando funções compiladas..."
        cp -r dist/* deploy_package/
        
        # Copiar node_modules
        echo "Copiando node_modules..."
        cp -r node_modules deploy_package/
        
        echo ""
        echo "Estrutura final antes do ZIP:"
        cd deploy_package
        ls -la
        
        echo ""
        echo "Verificando function.json existentes:"
        find . -name "function.json" -type f
        
        echo ""
        echo "Criando ZIP..."
        zip -r ../deploy.zip . \
          -x "*.git*" \
          -x "*.ts" \
          -x "tsconfig.json" \
          -x "*.test.js" \
          -x "tests/*" \
          -x ".env*" \
          -x "node_modules/@types/*"
        
        cd ..
        
        echo ""
        echo "✅ ZIP criado:"
        ls -lh deploy.zip
        
        echo ""
        echo "📋 Primeiros 100 arquivos do ZIP:"
        unzip -l deploy.zip | head -100
        
        echo ""
        echo "🔍 Verificações importantes:"
        echo "1. host.json na raiz:"
        unzip -l deploy.zip | grep "^\s*[0-9].*host\.json$" || echo "   ❌ NÃO ENCONTRADO NA RAIZ"
        
        echo ""
        echo "2. function.json files:"
        unzip -l deploy.zip | grep "function\.json$" || echo "   ❌ NENHUM ENCONTRADO"
        
        echo ""
        echo "3. Estrutura das funções:"
        unzip -l deploy.zip | grep "function\.json$"

    - name: 'Debug: Inspecionar ZIP completo'
      working-directory: api
      run: |
        echo "🔍 DIAGNÓSTICO COMPLETO DO ZIP"
        echo "================================"
        
        mkdir -p zip_check
        unzip -q deploy.zip -d zip_check
        
        cd zip_check
        
        echo ""
        echo "1️⃣ Arquivos na RAIZ do ZIP:"
        ls -la
        
        echo ""
        echo "2️⃣ host.json existe na raiz?"
        if [ -f "host.json" ]; then
          echo "✅ SIM"
          echo "Conteúdo do host.json:"
          cat host.json
        else
          echo "❌ NÃO - ISSO VAI CAUSAR ERRO 400!"
          echo "Procurando host.json em subpastas:"
          find . -name "host.json" -type f
        fi
        
        echo ""
        echo "3️⃣ Pastas de funções encontradas (diretórios na raiz, exceto node_modules):"
        find . -maxdepth 1 -type d ! -name "." ! -name ".." ! -name "node_modules" | sort
        
        echo ""
        echo "4️⃣ Todos os function.json encontrados:"
        find . -name "function.json" -type f | while read file; do
          echo ""
          echo "📄 $file"
          echo "Conteúdo:"
          cat "$file"
        done
        
        echo ""
        echo "5️⃣ package.json na raiz?"
        if [ -f "package.json" ]; then
          echo "✅ SIM"
          echo "Dependências principais:"
          cat package.json | grep -A 5 '"dependencies"' || echo "Não encontrado"
        else
          echo "❌ NÃO"
        fi
        
        echo ""
        echo "6️⃣ node_modules existe?"
        if [ -d "node_modules" ]; then
          echo "✅ SIM"
          echo "Tamanho: $(du -sh node_modules 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "Principais pacotes:"
          ls node_modules | head -20
        else
          echo "❌ NÃO"
        fi
        
        echo ""
        echo "7️⃣ Estrutura completa (até 3 níveis):"
        find . -maxdepth 3 -type f ! -path "*/node_modules/*" | head -50

    - name: 'Deploy via Múltiplos Métodos Kudu'
      working-directory: api
      env:
        KUDU_USER: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        KUDU_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🚀 Tentando deploy com múltiplos métodos..."
        echo "=========================================="
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        if [ -z "$KUDU_USER" ] || [ -z "$KUDU_PASS" ]; then
          echo "❌ ERRO: Credenciais vazias!"
          exit 1
        fi
        
        FILE_SIZE=$(stat -c%s deploy.zip 2>/dev/null || stat -f%z deploy.zip 2>/dev/null)
        echo "Tamanho do arquivo: $FILE_SIZE bytes ($(($FILE_SIZE / 1024 / 1024)) MB)"
        echo ""
        
        # ============================================
        # MÉTODO 1: /api/zip/site/wwwroot (VFS ZIP)
        # ============================================
        echo "=========================================="
        echo "MÉTODO 1: VFS ZIP Upload (/api/zip/site/wwwroot)"
        echo "=========================================="
        
        HTTP_CODE=$(curl -X PUT \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/zip" \
          -w "%{http_code}" \
          -o response1.txt \
          --max-time 600 \
          "$KUDU_URL/api/zip/site/wwwroot/")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ -f response1.txt ]; then
          echo "Response:"
          cat response1.txt
        fi
        
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
          echo ""
          echo "✅ MÉTODO 1 SUCESSO!"
          
          echo ""
          echo "Sincronizando triggers..."
          curl -X POST \
            --user "${KUDU_USER}:${KUDU_PASS}" \
            "$KUDU_URL/api/functions/synctriggers"
          
          echo ""
          echo "Aguardando 10s para aplicar mudanças..."
          sleep 10
          
          echo ""
          echo "✅ Deploy concluído via Método 1!"
          echo "DEPLOY_METHOD=VFS_ZIP" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "❌ Método 1 falhou"
        echo ""
        
        # ============================================
        # MÉTODO 2: /api/zipdeploy tradicional
        # ============================================
        echo "=========================================="
        echo "MÉTODO 2: ZipDeploy Tradicional (/api/zipdeploy)"
        echo "=========================================="
        
        HTTP_CODE=$(curl -X POST \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/octet-stream" \
          -w "%{http_code}" \
          -o response2.txt \
          --max-time 600 \
          "$KUDU_URL/api/zipdeploy")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ -f response2.txt ]; then
          echo "Response:"
          cat response2.txt
        fi
        
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
          echo ""
          echo "✅ MÉTODO 2 SUCESSO!"
          echo "DEPLOY_METHOD=ZIPDEPLOY" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "❌ Método 2 falhou"
        echo ""
        
        # ============================================
        # MÉTODO 3: /api/zipdeploy com async
        # ============================================
        echo "=========================================="
        echo "MÉTODO 3: ZipDeploy Async"
        echo "=========================================="
        
        HTTP_CODE=$(curl -X POST \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/octet-stream" \
          -w "%{http_code}" \
          -o response3.txt \
          --max-time 600 \
          "$KUDU_URL/api/zipdeploy?isAsync=true")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ -f response3.txt ]; then
          echo "Response:"
          cat response3.txt
        fi
        
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
          echo ""
          echo "✅ MÉTODO 3 SUCESSO!"
          echo "DEPLOY_METHOD=ZIPDEPLOY_ASYNC" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "❌ Método 3 falhou"
        echo ""
        
        # ============================================
        # MÉTODO 4: /api/publish
        # ============================================
        echo "=========================================="
        echo "MÉTODO 4: Publish API"
        echo "=========================================="
        
        HTTP_CODE=$(curl -X PUT \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/zip" \
          -w "%{http_code}" \
          -o response4.txt \
          --max-time 600 \
          "$KUDU_URL/api/publish?type=zip")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ -f response4.txt ]; then
          echo "Response:"
          cat response4.txt
        fi
        
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
          echo ""
          echo "✅ MÉTODO 4 SUCESSO!"
          echo "DEPLOY_METHOD=PUBLISH" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "❌ Método 4 falhou"
        echo ""
        
        # ============================================
        # MÉTODO 5: Upload manual via VFS
        # ============================================
        echo "=========================================="
        echo "MÉTODO 5: Upload Manual via VFS"
        echo "=========================================="
        
        echo "Limpando wwwroot..."
        curl -X DELETE \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/vfs/site/wwwroot/" \
          -H "If-Match: *"
        
        sleep 3
        
        echo "Fazendo upload..."
        HTTP_CODE=$(curl -X PUT \
          --user "${KUDU_USER}:${KUDU_PASS}" \
          --data-binary @deploy.zip \
          -H "Content-Type: application/zip" \
          -w "%{http_code}" \
          -o response5.txt \
          "$KUDU_URL/api/zip/site/wwwroot")
        
        echo "HTTP Status: $HTTP_CODE"
        
        if [ -f response5.txt ]; then
          echo "Response:"
          cat response5.txt
        fi
        
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
          echo ""
          echo "✅ MÉTODO 5 SUCESSO!"
          
          curl -X POST \
            --user "${KUDU_USER}:${KUDU_PASS}" \
            "$KUDU_URL/api/functions/synctriggers"
          
          echo "DEPLOY_METHOD=VFS_MANUAL" >> $GITHUB_ENV
          exit 0
        fi
        
        echo "❌ Método 5 falhou"
        echo ""
        
        # ============================================
        # TODOS FALHARAM - DIAGNÓSTICO
        # ============================================
        echo "=========================================="
        echo "❌ TODOS OS MÉTODOS FALHARAM!"
        echo "=========================================="
        echo ""
        
        echo "Tentando obter logs de erro..."
        echo ""
        echo "--- Docker Logs ---"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/logs/docker" 2>/dev/null | tail -100 || echo "Logs não disponíveis"
        
        echo ""
        echo "--- Deployment Logs ---"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/deployments" 2>/dev/null | head -100 || echo "Deployments não disponíveis"
        
        echo ""
        echo "--- App Settings ---"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/settings" 2>/dev/null | grep -E "(FUNCTIONS_|WEBSITE_|SCM_)" || echo "Settings não disponíveis"
        
        exit 1

    - name: 'Verificar arquivos deployados'
      if: success()
      env:
        KUDU_USER: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        KUDU_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "🔍 Verificando arquivos deployados..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        echo "Conteúdo de /site/wwwroot:"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/vfs/site/wwwroot/" | head -100
        
        echo ""
        echo "Verificando se host.json existe:"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/vfs/site/wwwroot/host.json"
        
        echo ""
        echo "Listando funções:"
        curl -s --user "${KUDU_USER}:${KUDU_PASS}" \
          "$KUDU_URL/api/functions"

    - name: 'Verificar status do deployment'
      if: success()
      env:
        KUDU_USER: ${{ secrets.AZURE_DEPLOY_USERNAME }}
        KUDU_PASS: ${{ secrets.AZURE_DEPLOY_PASSWORD }}
      run: |
        echo "⏳ Aguardando conclusão do deployment..."
        
        KUDU_URL="https://gremiomantosapi-d6gshveqc4fee0c2.scm.brazilsouth-01.azurewebsites.net"
        
        for i in {1..20}; do
          echo "Verificação $i/20..."
          
          LATEST=$(curl -s \
            --user "${KUDU_USER}:${KUDU_PASS}" \
            "$KUDU_URL/api/deployments/latest")
          
          STATUS=$(echo "$LATEST" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
          PROGRESS=$(echo "$LATEST" | jq -r '.progress // ""' 2>/dev/null || echo "")
          
          echo "Status: $STATUS"
          if [ -n "$PROGRESS" ]; then
            echo "Progress: $PROGRESS"
          fi
          
          if [ "$STATUS" = "4" ] || [ "$STATUS" = "Success" ]; then
            echo "✅ Deployment completo!"
            break
          elif [ "$STATUS" = "3" ] || [ "$STATUS" = "Failed" ]; then
            echo "❌ Deployment falhou!"
            echo "$LATEST" | jq '.' 2>/dev/null || echo "$LATEST"
            exit 1
          fi
          
          sleep 10
        done

    - name: 'Aguardar cold start'
      if: success()
      run: |
        echo "⏳ Aguardando inicialização da Function App (90s)..."
        sleep 90

    - name: 'Health Check'
      if: success()
      run: |
        echo "🔍 Testando endpoints..."
        
        BASE_URL="https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net"
        
        for i in {1..10}; do
          echo ""
          echo "Tentativa $i/10..."
          
          RESPONSE=$(curl -s -w "\n%{http_code}" "$BASE_URL/api/health" 2>/dev/null || echo -e "\nerror")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Health check passou!"
            echo "Resposta: $BODY"
            echo ""
            echo "🎉 Deploy concluído com sucesso!"
            echo "🔗 Function App: $BASE_URL"
            echo "📊 Método usado: ${DEPLOY_METHOD:-UNKNOWN}"
            exit 0
          elif [ "$HTTP_CODE" != "error" ]; then
            echo "Body: $BODY"
          fi
          
          if [ $i -lt 10 ]; then
            echo "Aguardando 15s..."
            sleep 15
          fi
        done
        
        echo ""
        echo "⚠️ Health check não passou após 10 tentativas"
        echo "Verifique manualmente: $BASE_URL/api/health"
        echo "Método de deploy usado: ${DEPLOY_METHOD:-UNKNOWN}"
