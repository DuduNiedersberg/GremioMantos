name: Deploy Azure Functions API

on:
  push:
    branches: [main]
    paths: 
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME:  gremiomantosapi
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'api'
  NODE_VERSION: '22. x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: 'Checkout código'
      uses: actions/checkout@v4

    - name: 'Setup Node.js ${{ env.NODE_VERSION }}'
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/package-lock.json'

    - name: 'Instalar dependências e build'
      shell: bash
      working-directory: ${{ env. AZURE_FUNCTIONAPP_PACKAGE_PATH }}
      run: |
        echo "📦 Instalando dependências..."
        npm ci
        echo "🔨 Building..."
        npm run build --if-present
        echo "✅ Build concluído!"

    - name: 'Deploy para Azure Functions'
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

    - name: 'Health Check'
      run: |
        echo "⏳ Aguardando cold start..."
        sleep 30
        echo "🔍 Testando endpoint /api/health..."
        curl -f https://gremiomantosapi-d6gshveqc4fee0c2.brazilsouth-01.azurewebsites.net/api/health || echo "⚠️ Health check falhou (pode ser CORS)"
