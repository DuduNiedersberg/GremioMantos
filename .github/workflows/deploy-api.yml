name: Deploy API to Railway

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway Token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "❌ RAILWAY_TOKEN secret not configured"
            echo ""
            echo "Configure it at: GitHub → Settings → Secrets → Actions"
            echo "Get token from: Railway Dashboard → Account Settings → Tokens"
            exit 1
          fi
          echo "✅ RAILWAY_TOKEN configured"

      - name: Install dependencies
        working-directory: api
        run: |
          echo "📦 Installing dependencies..."
          npm ci

      - name: Build TypeScript
        working-directory: api
        run: |
          echo "🔨 Building TypeScript..."
          npm run build
          
          echo ""
          echo "✅ Build completed. Output:"
          ls -la dist/ || echo "⚠️ dist/ folder not found"

      - name: Run tests (if available)
        working-directory: api
        continue-on-error: true
        run: |
          if grep -q '"test"' package.json; then
            echo "🧪 Running tests..."
            npm test
          else
            echo "⏭️ No tests configured"
          fi

      - name: Deploy to Railway
        working-directory: api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Deploying to Railway..."
          
          # Deploy usando Railway CLI
          railway up --detach
          
          echo ""
          echo "✅ Deploy initiated successfully!"
          echo "🔗 Check status at: https://railway.app/dashboard"

      - name: Get deployment URL
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "📍 Getting deployment URL..."
          
          # Tentar obter URL do serviço
          DOMAIN=$(railway domain 2>/dev/null || echo "")
          
          if [ -n "$DOMAIN" ]; then
            echo "🔗 Your API is available at: https://$DOMAIN"
            echo "DEPLOY_URL=https://$DOMAIN" >> $GITHUB_ENV
          else
            echo "ℹ️ URL will be available in Railway Dashboard"
          fi

      - name: Health check
        if: env.DEPLOY_URL != ''
        run: |
          echo "🏥 Performing health check..."
          echo "Waiting 30s for deployment to complete..."
          sleep 30
          
          for i in {1..5}; do
            echo ""
            echo "Attempt $i/5..."
            
            HTTP_CODE=$(curl -s -o /tmp/health.txt -w "%{http_code}" "${{ env.DEPLOY_URL }}/health" || echo "000")
            
            echo "HTTP Status: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed!"
              echo "Response:"
              cat /tmp/health.txt
              echo ""
              echo "🎉 Deployment successful!"
              exit 0
            fi
            
            if [ $i -lt 5 ]; then
              echo "Waiting 15s before retry..."
              sleep 15
            fi
          done
          
          echo ""
          echo "⚠️ Health check did not pass after 5 attempts"
          echo "Check Railway logs at: https://railway.app/dashboard"
          echo "Last response:"
          cat /tmp/health.txt 2>/dev/null || echo "(no response)"

      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 DEPLOYMENT SUMMARY"
          echo "=========================================="
          echo "Platform: Railway"
          echo "Environment: Production"
          echo "Node Version: ${{ env.NODE_VERSION }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "🔗 Railway Dashboard: https://railway.app/dashboard"
          if [ -n "${{ env.DEPLOY_URL }}" ]; then
            echo "🌐 API URL: ${{ env.DEPLOY_URL }}"
          fi
          echo "=========================================="
